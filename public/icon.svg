<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(80, 90)">
    <!-- Cap Diamond -->
    <path d="M176 40 L340 120 L176 200 L12 120 Z" fill="url(#capGrad)" />
    <!-- Cap Rim Under -->
    <path d="M52 140 L52 230 C52 280 300 280 300 230 L300 140 L176 200 Z" fill="#1d4ed8" opacity="0.9" />
    <!-- Tassel and Ribbon -->
    <path d="M290 128 L315 150 L315 220" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="315" cy="228" r="10" fill="url(#goldGrad)" />
    
    <!-- Open Book / Sprout underneath -->
    <path d="M80 270 C130 250 176 265 176 285 C176 265 222 250 272 270 L272 315 C222 295 176 310 176 330 C176 310 130 295 80 315 Z" fill="#ffffff" opacity="0.95" />
    <path d="M176 285 L176 330" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
